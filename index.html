<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>LifeBoard · 生活看板</title>
<style>
/* ============================================================
   LifeBoard — 设计系统
   参考：taste-skill / impeccable / ui-ux-pro-max
   风格：苹果式毛玻璃 · 三栏主从布局 · 分类主题色联动
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --bg-2: #ececf0;
  --panel: rgba(255,255,255,0.66);
  --panel-strong: rgba(255,255,255,0.84);
  --glass: rgba(255,255,255,0.55);
  --glass-heavy: rgba(255,255,255,0.8);
  --text: #1c1c1e;
  --text-2: #5b5b60;
  --text-3: #8e8e93;
  --sep: rgba(60,60,67,0.12);
  --sep-strong: rgba(60,60,67,0.18);

  --accent: #0a84ff;
  --accent-rgb: 10,132,255;
  --accent-soft: rgba(10,132,255,0.12);

  --danger: #ff3b30;
  --danger-rgb: 255,59,48;
  --ok: #30d158;
  --warn: #ff9f0a;

  --shadow-sm: 0 1px 2px rgba(28,28,30,0.06);
  --shadow-md: 0 6px 24px rgba(28,28,30,0.08), 0 2px 6px rgba(28,28,30,0.05);
  --shadow-lg: 0 18px 48px rgba(28,28,30,0.14), 0 6px 16px rgba(28,28,30,0.08);
  --shadow-float: 0 24px 70px rgba(28,28,30,0.2), 0 8px 24px rgba(28,28,30,0.1);

  --r-sm: 12px;
  --r: 18px;
  --r-lg: 24px;
  --r-xl: 30px;

  --blur: saturate(180%) blur(24px);
  --blur-soft: saturate(180%) blur(14px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --t-fast: 0.2s cubic-bezier(0.4,0,0.2,1);
  --t-smooth: 0.35s cubic-bezier(0.4,0,0.2,1);
  --t-spring: 0.5s cubic-bezier(0.34,1.56,0.64,1);

  --sidebar-w: 232px;
  --detail-w: 320px;
}

body[data-cat="memo"]   { --accent:#ff9f0a; --accent-rgb:255,159,10;  --accent-soft:rgba(255,159,10,0.12); }
body[data-cat="recipe"] { --accent:#30d158; --accent-rgb:48,209,88;   --accent-soft:rgba(48,209,88,0.13); }
body[data-cat="album"]  { --accent:#0a84ff; --accent-rgb:10,132,255;  --accent-soft:rgba(10,132,255,0.12); }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e11;
    --bg-2: #16161a;
    --panel: rgba(32,32,36,0.6);
    --panel-strong: rgba(38,38,44,0.82);
    --glass: rgba(40,40,46,0.5);
    --glass-heavy: rgba(46,46,54,0.82);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #6b6b72;
    --sep: rgba(84,84,92,0.28);
    --sep-strong: rgba(84,84,92,0.4);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 6px 24px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.35);
    --shadow-lg: 0 18px 48px rgba(0,0,0,0.6), 0 6px 16px rgba(0,0,0,0.4);
    --shadow-float: 0 24px 70px rgba(0,0,0,0.7), 0 8px 24px rgba(0,0,0,0.5);
  }
  body[data-cat="memo"]   { --accent:#ffb340; --accent-rgb:255,179,64;  --accent-soft:rgba(255,179,64,0.14); }
  body[data-cat="recipe"] { --accent:#34d96b; --accent-rgb:52,217,107;  --accent-soft:rgba(52,217,107,0.14); }
  body[data-cat="album"]  { --accent:#0a84ff; --accent-rgb:10,132,255;  --accent-soft:rgba(10,132,255,0.14); }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.5;
  letter-spacing: 0;
  transition: background var(--t-smooth), color var(--t-smooth);
}
input, textarea, button, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
img, video { max-width: 100%; display: block; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--sep-strong); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ============================================================
   流光背景
   ============================================================ */
#ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#ambient::before, #ambient::after { content:''; position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(110px); opacity: 0.5; will-change: transform; }
#ambient::before { background: radial-gradient(circle, rgba(var(--accent-rgb),0.32), transparent 62%); animation: drift1 30s ease-in-out infinite alternate; top:-24vmax; left:-22vmax; }
#ambient::after { background: radial-gradient(circle, rgba(175,82,222,0.26), transparent 62%); animation: drift2 36s ease-in-out infinite alternate; bottom:-26vmax; right:-22vmax; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(48vmax,40vmax) scale(1.25); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-46vmax,-34vmax) scale(1.15); } }

/* ============================================================
   应用外壳 — 三栏布局（桌面/iPad）
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--detail-w);
  gap: 0;
  min-height: 100dvh;
  max-width: 1560px;
  margin: 0 auto;
}

/* ---------- 侧边栏 ---------- */
.sidebar {
  position: sticky; top: 0; height: 100dvh;
  padding: 22px 16px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--sep);
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(var(--accent-rgb),0.9), rgba(var(--accent-rgb),0.55));
  display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
  box-shadow: 0 6px 16px rgba(var(--accent-rgb),0.3);
}
.brand-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.brand-sub { font-size: 0.7rem; color: var(--text-3); }

.side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--r-sm);
  font-size: 0.92rem; font-weight: 600; color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
  text-align: left; letter-spacing: -0.01em;
}
.nav-item .nav-ico { font-size: 1.15rem; width: 24px; text-align: center; transition: transform var(--t-spring); }
.nav-item:hover { background: rgba(var(--accent-rgb),0.07); color: var(--text); }
.nav-item:active { transform: scale(0.97); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item.active .nav-ico { transform: scale(1.12); }
.nav-item.active::before {
  content:''; position: absolute; left:-16px; top:20%; bottom:20%; width:4px;
  background: var(--accent); border-radius: 0 4px 4px 0;
}
.nav-count {
  margin-left: auto; font-size: 0.7rem; font-weight: 700; color: var(--text-3);
  background: var(--glass); border-radius: 20px; padding: 2px 9px; min-width: 24px; text-align: center;
  border: 1px solid var(--sep);
}
.nav-item.active .nav-count { color: var(--accent); background: rgba(var(--accent-rgb),0.1); border-color: rgba(var(--accent-rgb),0.25); }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
.sync-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--glass); border-radius: var(--r-sm); border: 1px solid var(--sep);
}
.sync-status { flex: 1; font-size: 0.78rem; font-weight: 600; color: var(--text-2); display: flex; align-items: center; }
.side-btn {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--r-sm);
  font-size: 0.88rem; font-weight: 600; color: var(--text-2); transition: background var(--t-fast), color var(--t-fast);
  text-align: left;
}
.side-btn:hover { background: rgba(var(--accent-rgb),0.07); color: var(--text); }
.side-foot-note { font-size: 0.68rem; color: var(--text-3); text-align: center; padding-top: 8px; }

/* ---------- 主内容区 ---------- */
.main { min-width: 0; padding: 0 28px 60px; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 4px; margin-bottom: 8px;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.topbar-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; }
.topbar-title em { font-style: normal; color: var(--accent); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* 手机端顶部 nav（桌面隐藏） */
.mobile-nav { display: none; }

/* === 分页式分类区域 === */
.category {
  display: none;
}
.category.active {
  display: block;
  animation: catPageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes catPageIn {
  0%   { opacity: 0; transform: translateY(16px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .category.active { animation: none; }
}

/* section header */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 18px; }
.section-title { font-size: 1.22rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.section-title .t-ico { font-size: 1.3rem; }

.add-btn {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 6px; padding: 10px 18px;
  background: var(--accent); color: #fff; border-radius: 999px;
  font-size: 0.86rem; font-weight: 600; letter-spacing: -0.01em;
  box-shadow: 0 8px 20px rgba(var(--accent-rgb),0.3);
  transition: transform var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
.add-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(var(--accent-rgb),0.38); }
.add-btn:active { transform: scale(0.96); }
.add-btn::after {
  content:''; position: absolute; top:0; left:-80%; width:55%; height:100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: skewX(-20deg); transition: left 0.55s ease;
}
.add-btn:hover::after { left: 130%; }

/* 相册网格 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; } }

.card {
  position: relative; overflow: hidden; cursor: pointer;
  background: var(--panel); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  border: 1px solid var(--sep); border-radius: var(--r);
  transition: transform var(--t-smooth), box-shadow var(--t-smooth), border-color var(--t-smooth);
  animation: cardIn 0.5s var(--t-spring) both;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(var(--accent-rgb),0.3); }
.card:active { transform: scale(0.97); }
.card-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--sep); }
.card-thumb-ph { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(var(--accent-rgb),0.12), rgba(var(--accent-rgb),0.03)); font-size: 2.6rem; }
.card-body { padding: 13px 15px; }
.card-title { font-size: 0.9rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.card-meta { font-size: 0.74rem; color: var(--text-3); margin-top: 3px; }

.card-check {
  position: absolute; top: 10px; right: 10px; z-index: 4;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--glass-heavy); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  border: 2px solid var(--sep-strong); color: #fff; font-size: 0.72rem;
  display: none; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
}
.select-mode .card-check { display: flex; }
.select-mode .card.selected { border-color: var(--accent); }
.select-mode .card.selected .card-check { background: var(--accent); border-color: var(--accent); }

.card-edit-btn {
  position: absolute; top: 10px; left: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--glass-heavy); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  border: 1px solid var(--sep); color: var(--accent); font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(0.8); transition: all 0.25s var(--t-spring); box-shadow: var(--shadow-sm);
}
.card:hover .card-edit-btn, .card:focus-within .card-edit-btn { opacity: 1; transform: scale(1); }
.card-edit-btn:hover { background: var(--accent); color: #fff; }

/* 备忘录 / 菜谱 列表 */
.list-card {
  position: relative; display: flex; gap: 15px; align-items: flex-start;
  padding: 16px; margin-bottom: 12px; cursor: pointer;
  background: var(--panel); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  border: 1px solid var(--sep); border-radius: var(--r);
  transition: transform var(--t-smooth), box-shadow var(--t-smooth), border-color var(--t-smooth);
  animation: cardIn 0.5s var(--t-spring) both;
}
.list-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(var(--accent-rgb),0.28); }
.list-card:active { transform: scale(0.99); }
.list-thumb { width: 74px; height: 74px; border-radius: var(--r-sm); object-fit: cover; flex-shrink: 0; background: var(--sep); cursor: zoom-in; }
.list-body { flex: 1; min-width: 0; }
.list-title { font-size: 0.98rem; font-weight: 650; margin-bottom: 4px; letter-spacing: -0.01em; }
.list-text { font-size: 0.82rem; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.list-meta { font-size: 0.72rem; color: var(--text-3); margin-top: 7px; }
.list-card .card-check { display: none; }
.select-mode .list-card .card-check { display: flex; }
.select-mode .list-card.selected { border-color: var(--accent); }
.select-mode .list-card.selected .card-check { background: var(--accent); border-color: var(--accent); }

/* ---------- 右侧详情面板 ---------- */
.detail-panel {
  position: sticky; top: 0; height: 100dvh; overflow-y: auto;
  padding: 22px 18px; border-left: 1px solid var(--sep);
  display: flex; flex-direction: column;
}
.dp-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 16px; }

.stat-hero {
  background: linear-gradient(135deg, rgba(var(--accent-rgb),0.14), rgba(var(--accent-rgb),0.04));
  border: 1px solid rgba(var(--accent-rgb),0.22); border-radius: var(--r);
  padding: 22px 20px; margin-bottom: 16px;
}
.stat-hero .num { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
.stat-hero .lbl { font-size: 0.82rem; color: var(--text-2); margin-top: 6px; font-weight: 600; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.stat-cell {
  background: var(--glass); border: 1px solid var(--sep); border-radius: var(--r-sm);
  padding: 14px 10px; text-align: center;
}
.stat-cell .ico { font-size: 1.3rem; }
.stat-cell .n { font-size: 1.3rem; font-weight: 750; margin-top: 4px; letter-spacing: -0.02em; }
.stat-cell .t { font-size: 0.68rem; color: var(--text-3); margin-top: 2px; }

.dp-block { margin-bottom: 22px; }
.dp-block-title { font-size: 0.76rem; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.gb-entry { padding: 11px 12px; background: var(--glass); border: 1px solid var(--sep); border-radius: var(--r-sm); margin-bottom: 8px; }
.gb-entry .who { font-size: 0.72rem; font-weight: 700; }
.gb-entry .msg { font-size: 0.84rem; margin-top: 3px; word-break: break-word; }
.gb-entry .when { font-size: 0.68rem; color: var(--text-3); margin-top: 4px; }
.dp-hint { font-size: 0.74rem; color: var(--text-3); line-height: 1.6; }

/* 详情预览态 */
.detail-view { display: none; flex-direction: column; gap: 14px; }
.detail-head { display: flex; align-items: center; justify-content: space-between; }
.detail-back { display: flex; align-items: center; gap: 4px; font-size: 0.88rem; font-weight: 650; color: var(--accent); padding: 6px 10px; border-radius: 10px; transition: background var(--t-fast); }
.detail-back:hover { background: var(--accent-soft); }
.detail-count { font-size: 0.76rem; font-weight: 700; color: var(--text-3); }
.detail-media-wrap { border-radius: var(--r); overflow: hidden; background: var(--sep); box-shadow: var(--shadow-md); }
.detail-media { width: 100%; max-height: 40dvh; object-fit: contain; background: #000; }
.pc-label { font-size: 0.72rem; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
.pc-input {
  width: 100%; padding: 12px 14px; border-radius: var(--r-sm); resize: vertical; min-height: 64px;
  border: 1px solid var(--sep); background: var(--glass); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  font-size: 0.86rem; outline: none; transition: border var(--t-fast), box-shadow var(--t-fast);
}
.pc-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.15); }
.pc-input.fat { font-weight: 600; }
.pc-input.thin { font-weight: 300; font-size: 0.8rem; letter-spacing: 0.02em; }
.detail-nav { display: flex; justify-content: space-between; gap: 10px; }
.dnav-btn {
  flex: 1; padding: 11px; border-radius: var(--r-sm); font-size: 0.86rem; font-weight: 650;
  background: var(--glass); border: 1px solid var(--sep); transition: all var(--t-fast);
}
.dnav-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: rgba(var(--accent-rgb),0.3); }

/* ============================================================
   手机 / 平板竖屏（<960px）
   ============================================================ */
@media (max-width: 959px) {
  .app-shell { display: block; }
  .sync-pill { padding: 8px 12px; }
  .sync-pill-txt { display: none; }
  .sidebar { display: none; }
  .detail-panel { display: none; }

  .main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

  .topbar { padding: 14px 2px; margin-bottom: 4px; }
  .topbar-title { font-size: 1.3rem; }
  .brand-mark-sm { display: inline-flex; }

  .mobile-nav {
    display: block; position: sticky; top: 0; z-index: 30;
    padding: 6px 0 14px; display: flex; justify-content: center;
    background: linear-gradient(var(--bg) 72%, transparent);
  }
  .seg-control {
    position: relative; display: flex; width: 100%; max-width: 460px;
    background: var(--panel); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--sep); border-radius: 999px; padding: 5px;
    box-shadow: var(--shadow-sm);
  }
  .seg-slider {
    position: absolute; top: 5px; bottom: 5px; left: 5px; width: 0;
    background: rgba(var(--accent-rgb),0.13); border-radius: 999px;
    transition: left var(--t-spring), width var(--t-spring);
  }
  .seg-btn {
    position: relative; z-index: 1; flex: 1; padding: 10px 8px;
    border-radius: 999px; font-size: 0.84rem; font-weight: 600; color: var(--text-2);
    white-space: nowrap; transition: color var(--t-smooth);
  }
  .seg-btn.active { color: var(--accent); }
  .seg-btn:active { transform: scale(0.96); }

  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card-edit-btn { opacity: 1; transform: scale(1); }
  .section-title { font-size: 1.1rem; }

  /* 移动端菜单降级：关闭 backdrop-filter 消除卡顿 */
  .context-menu { top: 58px; right: 10px; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--panel-strong); }
  .context-overlay { backdrop-filter: none; -webkit-backdrop-filter: none; }

  /* 移动端性能：关闭大模糊背景动画 + 顶部毛玻璃降级为纯色 */
  #ambient { display: none; }
  .seg-control { background: var(--panel); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .floating-nav { backdrop-filter: none; -webkit-backdrop-filter: none; }
}

/* ---------- 底部悬浮导航 ---------- */
.floating-nav {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 40; display: none; align-items: center; gap: 6px; padding: 8px;
  background: var(--glass-heavy); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--sep); border-radius: 999px; box-shadow: var(--shadow-float);
}
.fab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 56px; padding: 8px 14px; border-radius: 999px;
  color: var(--text-2); font-size: 0.68rem; font-weight: 650; transition: all var(--t-fast);
}
.fab .f-ico { font-size: 1.25rem; transition: transform var(--t-spring); }
.fab:hover { background: rgba(var(--accent-rgb),0.08); color: var(--text); }
.fab:active { transform: scale(0.94); }
.fab.primary {
  background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(var(--accent-rgb),0.38);
  min-width: 62px; padding: 10px 16px;
}
.fab.primary:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }
.fab.primary .f-ico { font-size: 1.4rem; }

@media (max-width: 959px) { .floating-nav { display: flex; } }

/* ============================================================
   模态框
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.4);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn var(--t-smooth) forwards;
}
.modal {
  background: var(--panel-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--sep-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-float);
  width: 100%; max-width: 540px; max-height: 86dvh; overflow-y: auto; padding: 26px;
  animation: modalIn var(--t-spring) forwards;
}
.modal-title { font-size: 1.18rem; font-weight: 700; margin-bottom: 22px; letter-spacing: -0.02em; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--text-2); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-input, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--r-sm); font-size: 0.9rem; outline: none;
  border: 1px solid var(--sep); background: var(--glass); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft);
  transition: border var(--t-fast), box-shadow var(--t-fast);
}
.form-textarea { min-height: 104px; resize: vertical; }
.form-input:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.15); }
.form-file {
  display: block; width: 100%; padding: 14px; text-align: center; cursor: pointer;
  border: 2px dashed var(--sep-strong); border-radius: var(--r-sm); font-size: 0.85rem; color: var(--text-3);
  transition: all var(--t-fast);
}
.form-file:hover { border-color: var(--accent); color: var(--accent); }
.form-file input { display: none; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.btn { padding: 10px 20px; border-radius: var(--r-sm); font-size: 0.88rem; font-weight: 650; transition: all var(--t-fast); }
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(var(--accent-rgb),0.28); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-secondary { background: var(--glass); border: 1px solid var(--sep); backdrop-filter: var(--blur-soft); -webkit-backdrop-filter: var(--blur-soft); }
.btn-secondary:hover { background: rgba(var(--accent-rgb),0.08); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
/* ---------- 相册详情 浮雕悬浮窗 ---------- */
.album-detail-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease-out;
}
.album-detail {
  position: relative; display: flex; flex-direction: column;
  width: 100%; max-width: 780px; height: min(86dvh, 820px);
  background: linear-gradient(165deg, #fefefe 0%, #f1f2f7 55%, #e4e6ec 100%);
  border-radius: 30px;
  box-shadow:
    0 32px 80px rgba(0,0,0,0.38),
    0 10px 28px rgba(0,0,0,0.16),
    inset 0 1px 0 rgba(255,255,255,0.95),
    inset 0 -1px 0 rgba(0,0,0,0.08),
    inset 0 0 0 1px rgba(255,255,255,0.4);
  overflow: hidden;
  animation: albumFloatIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  border: 1px solid rgba(255,255,255,0.55);
}
@keyframes albumFloatIn {
  0%   { opacity: 0; transform: translateY(40px) scale(0.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.album-detail-top {
  display: flex; align-items: center; gap: 10px; padding: 16px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.5));
  border-bottom: 1px solid rgba(0,0,0,0.08);
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.7), 0 1px 4px rgba(0,0,0,0.06);
  position: sticky; top: 0; z-index: 2;
}
.ad-back, .ad-edit {
  padding: 9px 16px; border-radius: 14px; font-size: 0.84rem; font-weight: 650;
  transition: all var(--t-fast); letter-spacing: -0.01em;
}
.ad-back {
  background: linear-gradient(180deg, #fff 0%, #f0f1f5 100%);
  border: 1px solid rgba(0,0,0,0.1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.9);
  color: var(--text);
}
.ad-back:hover { background: linear-gradient(180deg, #f4f5f9 0%, #e8e9ef 100%); transform: scale(1.02); }
.ad-back:active { transform: scale(0.97); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.ad-edit {
  background: linear-gradient(180deg, var(--accent), var(--accent));
  color: #fff; margin-left: auto;
  box-shadow: 0 3px 12px rgba(var(--accent-rgb),0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.15);
}
.ad-edit:hover { filter: brightness(1.08); transform: scale(1.02); }
.ad-edit:active { transform: scale(0.97); }
.ad-pull {
  padding: 9px 14px; border-radius: 14px; font-size: 0.84rem; font-weight: 650;
  background: linear-gradient(180deg, rgba(48,209,88,0.16) 0%, rgba(48,209,88,0.1) 100%);
  color: var(--ok); border: 1px solid rgba(48,209,88,0.32);
  box-shadow: 0 2px 6px rgba(48,209,88,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
  transition: all var(--t-fast); letter-spacing: -0.01em;
}
.ad-pull:hover { background: linear-gradient(180deg, rgba(48,209,88,0.26) 0%, rgba(48,209,88,0.16) 100%); transform: scale(1.02); }
.ad-pull:active { transform: scale(0.97); }
.ad-pull.spinning { animation: spin 0.9s linear infinite; }
.ad-pull.done { color: #fff; background: linear-gradient(180deg, var(--ok), #2ab74d); }
.ad-title {
  flex: 1; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
  text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ad-progress {
  text-align: center; padding: 10px 16px; margin: 6px 0 0;
  border-radius: 12px; background: var(--accent-soft); color: var(--accent);
  font-size: 0.84rem; font-weight: 600;
}
.album-detail-body {
  flex: 1; overflow-y: auto; padding: 16px;
  max-width: 900px; margin: 0 auto; width: 100%;
}
@media (max-width: 959px) {
  .album-detail-overlay { padding: 10px; }
  .album-detail {
    max-width: 100%; height: 92dvh; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 6px 16px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.06);
  }
  .album-detail-top { padding: 12px 14px; }
  .ad-title { font-size: 1.05rem; }
  .album-detail-body { padding: 12px; }
  .ad-back, .ad-edit { padding: 7px 13px; font-size: 0.8rem; }
}
@media (prefers-color-scheme: dark) {
  .album-detail {
    background: linear-gradient(165deg, #2a2a32 0%, #21212a 55%, #1a1a22 100%);
  }
  .album-detail-top {
    background: linear-gradient(180deg, rgba(40,40,50,0.9), rgba(30,30,38,0.6));
    border-bottom: 1px solid rgba(255,255,255,0.06);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.05), 0 1px 4px rgba(0,0,0,0.2);
  }
  .ad-back {
    background: linear-gradient(180deg, #3a3a44 0%, #303038 100%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
    color: #eee;
  }
  .ad-back:hover { background: linear-gradient(180deg, #444 0%, #383840 100%); }
}

/* 照片全屏预览（手机端） */
.preview-overlay {
  position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn 0.25s ease-out forwards;
}
.preview-close {
  position: absolute; top: 18px; right: 18px; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; z-index: 2;
  transition: all var(--t-fast);
}
.preview-close:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
.preview-media { max-width: 92vw; max-height: 56dvh; border-radius: var(--r); object-fit: contain; box-shadow: var(--shadow-float); animation: modalIn var(--t-spring) forwards; }
.preview-comments { width: 100%; max-width: 480px; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; animation: fadeSlideIn 0.3s ease-out 0.1s both; }
.preview-comment-input {
  width: 100%; padding: 13px 15px; border-radius: var(--r); font-size: 0.9rem; outline: none;
  border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.14);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff;
  transition: all var(--t-fast);
}
.preview-comment-input::placeholder { color: rgba(255,255,255,0.5); }
.preview-comment-input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.22); }
.preview-comment-input.fat { font-weight: 600; }
.preview-comment-input.thin { font-weight: 300; font-size: 0.82rem; letter-spacing: 0.02em; }
.preview-comment-label { font-size: 0.7rem; color: rgba(255,255,255,0.6); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.preview-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all var(--t-fast); z-index: 2;
}
.preview-nav:hover { background: rgba(255,255,255,0.35); }
.preview-nav.prev { left: 14px; }
.preview-nav.next { right: 14px; }

/* 上下文菜单（无 backdrop-filter，避免弹出时全屏模糊合成卡顿） */
.context-overlay { position: fixed; inset: 0; z-index: 250; background: rgba(0,0,0,0.2); animation: fadeIn 0.15s ease-out forwards; }
.context-menu {
  position: fixed; top: 64px; right: 16px; z-index: 251;
  background: var(--panel-strong);
  border: 1px solid var(--sep); border-radius: var(--r); box-shadow: var(--shadow-float);
  padding: 8px; min-width: 216px;
  animation: menuFade 0.15s ease-out forwards;
}
@keyframes menuFade { from { opacity: 0; } to { opacity: 1; } }
.context-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 14px; border-radius: var(--r-sm); font-size: 0.9rem; font-weight: 550; color: var(--text); transition: background var(--t-fast); text-align: left; }
.context-item:hover { background: rgba(var(--accent-rgb),0.08); }
.context-item:active { background: rgba(var(--accent-rgb),0.14); }
.context-item.danger { color: var(--danger); }
.context-divider { height: 1px; background: var(--sep); margin: 6px 8px; }

/* 留言横幅 */
.guestbook-banner {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 180;
  background: var(--glass-heavy); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--sep); border-radius: var(--r-lg); box-shadow: var(--shadow-float);
  padding: 16px 20px; max-width: 430px; width: calc(100% - 32px);
  animation: bannerIn 0.4s var(--t-spring) forwards;
}
.guestbook-banner-author { font-size: 0.74rem; color: var(--text-2); margin-bottom: 4px; }
.guestbook-banner-msg { font-size: 0.95rem; font-weight: 550; margin-bottom: 8px; }
.guestbook-banner-close { position: absolute; top: 8px; right: 12px; font-size: 1.2rem; color: var(--text-3); padding: 4px; }

/* 多选栏 */
.select-bar {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 190;
  background: var(--glass-heavy); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--sep); border-radius: 999px; box-shadow: var(--shadow-float);
  padding: 10px 20px; display: flex; align-items: center; gap: 16px; animation: bannerIn 0.35s ease-out forwards;
}
.select-count { font-size: 0.9rem; font-weight: 650; }

/* Toast */
.toast {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 999;
  background: var(--glass-heavy); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--sep); border-radius: 999px; box-shadow: var(--shadow-lg);
  padding: 12px 24px; font-size: 0.86rem; font-weight: 600; animation: toastIn 0.35s ease-out forwards;
}

/* 空状态 */
.empty-state { text-align: center; padding: 64px 20px; color: var(--text-3); }
.empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state-text { font-size: 0.9rem; }

/* 同步状态点 */
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex-shrink: 0; box-shadow: 0 0 0 3px rgba(48,209,88,0.18); }
.sync-dot.syncing { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,159,10,0.18); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--danger); box-shadow: 0 0 0 3px rgba(255,59,48,0.18); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

.icon-btn {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--accent); font-size: 1.2rem; transition: background var(--t-fast), transform var(--t-fast);
}
.icon-btn:hover { background: var(--accent-soft); }
.icon-btn:active { transform: scale(0.92); }
.sync-btn.spinning { animation: spin 0.9s linear infinite; }
.sync-pill {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px;
  background: linear-gradient(180deg, var(--accent), rgba(var(--accent-rgb),0.82));
  color: #fff; font-size: 0.82rem; font-weight: 650; letter-spacing: -0.01em;
  box-shadow: 0 4px 14px rgba(var(--accent-rgb),0.35), inset 0 1px 0 rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.2);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.sync-pill:hover { transform: scale(1.04); box-shadow: 0 6px 18px rgba(var(--accent-rgb),0.45), inset 0 1px 0 rgba(255,255,255,0.3); }
.sync-pill:active { transform: scale(0.96); }
.sync-pill.spinning .sync-pill-ico { animation: spin 0.9s linear infinite; }
.sync-pill.done { background: linear-gradient(180deg, var(--ok), #2ab74d); }
.sync-btn.done { color: var(--ok); transform: scale(1.15); transition: transform 0.3s var(--t-spring); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 动效 keyframes */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes bannerIn { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-18px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* 卡片流光边框 */
.card::before, .list-card::before {
  content:''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: 3; pointer-events: none;
  background: linear-gradient(120deg, rgba(var(--accent-rgb),0) 0%, rgba(var(--accent-rgb),0.7) 25%, rgba(175,82,222,0.7) 50%, rgba(var(--accent-rgb),0.7) 75%, rgba(var(--accent-rgb),0) 100%);
  background-size: 300% 100%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity 0.4s ease; animation: borderShine 3s linear infinite;
}
.card:hover::before, .list-card:hover::before, .card.selected::before, .list-card.selected::before { opacity: 1; }
@keyframes borderShine { from { background-position: 0% 0; } to { background-position: 300% 0; } }

/* 导航滑块流光 */
.seg-slider::after {
  content:''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(120deg, transparent 30%, rgba(var(--accent-rgb),0.24) 50%, transparent 70%);
  background-size: 250% 100%; animation: sliderShine 3.2s linear infinite;
}
@keyframes sliderShine { from { background-position: 220% 0; } to { background-position: -30% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

  <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importBackup(event)">

<script>
// ============================================================
// 数据引擎
// ============================================================
const STORAGE_KEY = 'lifeboard_data';
const CLOUD_SHA_KEY = 'lifeboard_cloud_sha';
const SYNC_OWNER = 'wantaoxxx';
const SYNC_REPO = 'lifeboard';
const SYNC_FILE = 'lifeboard-data.json';
let GITHUB_TOKEN = localStorage.getItem('lifeboard_github_token') || '';
const SYNC_INTERVAL = 10000;

let data = { albums: [], memos: [], recipes: [], guestbook: [] };

let currentCat = 'album';
let isSelectMode = false;
let selectedIds = new Set();
let currentAlbumId = null;
let currentPreviewIndex = 0;
let currentPreviewItems = [];
let cloudSha = localStorage.getItem(CLOUD_SHA_KEY) || null;
let syncTimer = null;
let isSyncing = false;
let dirty = false;
let syncScheduled = false;
function scheduleSync() {
  dirty = true;
  if (!syncScheduled) {
    syncScheduled = true;
    setTimeout(function() { syncScheduled = false; if (dirty) { dirty = false; syncToCloud(); } }, 3000);
  }
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { try { data = JSON.parse(raw); } catch(e) {} }
}
function saveData(skipSchedule) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { console.error('Save error:', e); } if (!skipSchedule) scheduleSync(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
loadData();

// ============================================================
// 云端同步（GitHub Contents API）
// ============================================================
function updateSyncDot(state) {
  const dots = [document.getElementById('syncDot'), document.getElementById('syncDotM')];
  const statusText = document.getElementById('syncStatusText');
  dots.forEach(function(d) {
    if (!d) return;
    d.className = 'sync-dot';
    if (state === 'syncing') d.classList.add('syncing');
    if (state === 'error') d.classList.add('error');
    d.title = state === 'syncing' ? '同步中…' : state === 'error' ? '同步失败' : '已同步';
  });
  if (statusText) {
    statusText.textContent = state === 'syncing' ? '同步中…' : state === 'error' ? '同步失败' : '已同步';
  }
}

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
}

async function syncToCloud() {
  if (isSyncing) return;
  isSyncing = true;
  updateSyncDot('syncing');
  try {
    const content = JSON.stringify(data, null, 2);
    const b64 = utf8ToBase64(content);
    const url = 'https://api.github.com/repos/' + SYNC_OWNER + '/' + SYNC_REPO + '/contents/' + SYNC_FILE;
    // Get current sha if we don't have it
    let sha = cloudSha;
    if (!sha) {
      try {
        const infoResp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github+json' } });
        if (infoResp.ok) {
          const info = await infoResp.json();
          sha = info.sha;
        }
      } catch(e) {}
    }
    const body = { message: 'LifeBoard sync', content: b64, branch: 'main' };
    if (sha) body.sha = sha;
    const resp = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const result = await resp.json();
    cloudSha = result.content ? result.content.sha : sha;
    if (cloudSha) localStorage.setItem(CLOUD_SHA_KEY, cloudSha);
    updateSyncDot('ok');
    isSyncing = false;
    return true;
  } catch(e) {
    console.error('Sync error:', e);
    updateSyncDot('error');
    isSyncing = false;
    return false;
  }
}

async function loadFromCloud() {
  try {
    const url = 'https://api.github.com/repos/' + SYNC_OWNER + '/' + SYNC_REPO + '/contents/' + SYNC_FILE + '?ref=main';
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github+json' } });
    if (resp.status === 404) return false;
    if (!resp.ok) return false;
    const result = await resp.json();
    // 云端 sha 与本地一致 -> 无新内容，跳过合并
    if (result.sha && result.sha === cloudSha) return true;
    cloudSha = result.sha;
    if (cloudSha) localStorage.setItem(CLOUD_SHA_KEY, cloudSha);
    if (result.content) {
      const cloudData = JSON.parse(base64ToUtf8(result.content));
      data = {
        albums: mergeArrays(cloudData.albums || [], data.albums),
        memos: mergeArrays(cloudData.memos || [], data.memos),
        recipes: mergeArrays(cloudData.recipes || [], data.recipes),
        guestbook: mergeArrays(cloudData.guestbook || [], data.guestbook)
      };
      saveData(true);
      return true;
    }
    return true;
  } catch(e) { console.error('Load from cloud error:', e); return false; }
}

function mergeArrays(cloudArr, localArr) {
  const map = new Map();
  for (let j = 0; j < cloudArr.length; j++) map.set(cloudArr[j].id, cloudArr[j]);
  for (let i = 0; i < localArr.length; i++) map.set(localArr[i].id, localArr[i]);
  return Array.from(map.values());
}

function startSync() {
  // 定时拉取云端数据（合并别人添加的内容），推送由 scheduleSync 在数据变化时触发
  syncTimer = setInterval(function() { loadFromCloud().then(function() { renderAll(); refreshOpenAlbumGrid(); }); }, SYNC_INTERVAL);
  loadFromCloud().then(function() { renderAll(); refreshOpenAlbumGrid(); });
  // 首次加载完成后立即推送一次本地数据
  setTimeout(function() { syncToCloud(); }, 4000);
}

function refreshOpenAlbumGrid() {
  if (!currentAlbumId) return;
  const grid = document.getElementById('albumItemsGrid');
  if (!grid) return;
  const album = data.albums.find(function(a) { return a.id === currentAlbumId; });
  if (album) refreshAlbumGrid(album);
}

function manualSync() {
  const btns = [document.getElementById('syncBtn'), document.getElementById('syncBtnM')];
  const spinning = btns.some(function(b) { return b && b.classList.contains('spinning'); });
  if (spinning) return;
  btns.forEach(function(b) { if (b) b.classList.add('spinning'); });
  if (!GITHUB_TOKEN) {
    btns.forEach(function(b) { if (b) b.classList.remove('spinning'); });
    showToast('⚠️ 未设置 Token，请先点 ⋯ → 同步设置');
    openTokenModal();
    return;
  }
  syncToCloud().then(function(ok) {
    return loadFromCloud().then(function() { renderAll(); refreshOpenAlbumGrid(); return ok; });
  }).then(function(ok) {
    btns.forEach(function(b) { if (b) { b.classList.remove('spinning'); b.classList.add('done'); setTimeout(function(){ b.classList.remove('done'); }, 1600); } });
    showToast(ok ? '✅ 同步完成 ✓ 已推送并拉取最新数据' : '❌ 同步失败：请检查 Token 权限（需 Contents 读写）和网络');
  });
}

function pullOnly() {
  if (!GITHUB_TOKEN) { showToast('⚠️ 未设置 Token，请先点 ⋯ → 同步设置'); openTokenModal(); return; }
  const btn = document.getElementById('adPullBtn');
  if (btn) btn.classList.add('spinning');
  loadFromCloud().then(function(ok) {
    renderAll();
    refreshOpenAlbumGrid();
    if (btn) { btn.classList.remove('spinning'); btn.classList.add('done'); setTimeout(function(){ btn.classList.remove('done'); }, 1600); }
    showToast(ok ? '已拉取云端最新数据 ✓' : '云端暂无更多数据');
  }).catch(function() {
    if (btn) btn.classList.remove('spinning');
    showToast('拉取失败，请检查网络或同步设置');
  });
}

// ============================================================
// 渲染
// ============================================================
function renderAll() {
  renderAlbums();
  renderMemos();
  renderRecipes();
  renderCounts();
  renderOverview();
}

function renderCounts() {
  setText('cnt-album', data.albums.length);
  setText('cnt-memo', data.memos.length);
  setText('cnt-recipe', data.recipes.length);
  setText('st-album', data.albums.length);
  setText('st-memo', data.memos.length);
  setText('st-recipe', data.recipes.length);
}

function renderOverview() {
  const counts = { album: data.albums.length, memo: data.memos.length, recipe: data.recipes.length };
  const hero = document.getElementById('heroNum');
  const heroLbl = document.getElementById('heroLbl');
  if (hero) hero.textContent = counts[currentCat];
  if (heroLbl) heroLbl.textContent = { album: '相册', memo: '备忘录', recipe: '菜谱' }[currentCat];

  const box = document.getElementById('recentGuestbook');
  if (box) {
    const recent = data.guestbook.slice().reverse().slice(0, 3);
    if (recent.length === 0) {
      box.innerHTML = '<div class="dp-hint">暂无留言</div>';
    } else {
      box.innerHTML = recent.map(function(e) {
        return '<div class="gb-entry"><div class="who">' + (e.user === '大胖小子' ? '🐷 大胖小子' : '🐱 小瘦大子') + '</div>' +
          '<div class="msg">' + escHtml(e.message) + '</div>' +
          '<div class="when">' + formatDate(e.timestamp) + '</div></div>';
      }).join('');
    }
  }
}

function renderAlbums() {
  const grid = document.getElementById('albumGrid');
  const empty = document.getElementById('albumEmpty');
  grid.innerHTML = '';
  if (data.albums.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  data.albums.forEach(function(album, ai) {
    const card = document.createElement('div');
    card.className = 'card' + (isSelectMode && selectedIds.has(album.id) ? ' selected' : '');
    card.style.animationDelay = (ai * 0.045) + 's';
    card.onclick = function() {
      if (isSelectMode) { toggleSelect(album.id, card); return; }
      openAlbum(album.id);
    };
    card.innerHTML = '<div class="card-check">&#10003;</div>' +
      '<button class="card-edit-btn" onclick="event.stopPropagation();openAlbumModal(\'' + album.id + '\')" title="编辑封面/名称">✎</button>' +
      (album.cover ? '<img class="card-thumb" src="' + album.cover + '" alt="' + escHtml(album.name) + '" loading="lazy">' : '<div class="card-thumb-ph">📷</div>') +
      '<div class="card-body"><div class="card-title">' + escHtml(album.name) + '</div><div class="card-meta">' + (album.items || []).length + ' 项</div></div>';
    grid.appendChild(card);
  });
}

function renderMemos() {
  const list = document.getElementById('memoList');
  const empty = document.getElementById('memoEmpty');
  list.innerHTML = '';
  if (data.memos.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  data.memos.forEach(function(memo, mi) {
    const card = document.createElement('div');
    card.className = 'list-card' + (isSelectMode && selectedIds.has(memo.id) ? ' selected' : '');
    card.style.animationDelay = (mi * 0.045) + 's';
    card.onclick = function() {
      if (isSelectMode) { toggleSelect(memo.id, card); return; }
      openMemoModal(memo.id);
    };
    const imgHtml = memo.image
      ? '<img class="list-thumb" src="' + memo.image + '" alt="" loading="lazy" onclick="event.stopPropagation();previewMemoRecipeItem(\'' + memo.id + '\',\'memo\')">'
      : '';
    card.innerHTML = '<div class="card-check">&#10003;</div>' + imgHtml +
      '<div class="list-body"><div class="list-title">' + escHtml(memo.title) + '</div><div class="list-text">' + escHtml(memo.content || '') + '</div><div class="list-meta">' + formatDate(memo.createdAt) + '</div></div>';
    list.appendChild(card);
  });
}

function renderRecipes() {
  const list = document.getElementById('recipeList');
  const empty = document.getElementById('recipeEmpty');
  list.innerHTML = '';
  if (data.recipes.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  data.recipes.forEach(function(recipe, ri) {
    const card = document.createElement('div');
    card.className = 'list-card' + (isSelectMode && selectedIds.has(recipe.id) ? ' selected' : '');
    card.style.animationDelay = (ri * 0.045) + 's';
    card.onclick = function() {
      if (isSelectMode) { toggleSelect(recipe.id, card); return; }
      openRecipeModal(recipe.id);
    };
    const imgHtml = recipe.image
      ? '<img class="list-thumb" src="' + recipe.image + '" alt="" loading="lazy" onclick="event.stopPropagation();previewMemoRecipeItem(\'' + recipe.id + '\',\'recipe\')">'
      : '';
    card.innerHTML = '<div class="card-check">&#10003;</div>' + imgHtml +
      '<div class="list-body"><div class="list-title">' + escHtml(recipe.title) + '</div><div class="list-text">' + escHtml(recipe.content || '') + '</div><div class="list-meta">' + formatDate(recipe.createdAt) + '</div></div>';
    list.appendChild(card);
  });
}

// ============================================================
// 分类切换
// ============================================================
const CAT_NAMES = { album: '相册', memo: '备忘录', recipe: '菜谱' };

function switchCategory(cat) {
  if (currentCat === cat && !isSelectMode) return;
  exitSelectMode();
  currentCat = cat;
  document.body.setAttribute('data-cat', cat);
  document.querySelectorAll('.nav-item, .seg-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.cat === cat); });
  document.querySelectorAll('.category').forEach(function(c) { c.classList.toggle('active', c.id === 'cat-' + cat); });
  const topCat = document.getElementById('topCatName');
  if (topCat) topCat.textContent = '· ' + CAT_NAMES[cat];
  updateSlider();
  renderOverview();
}

function updateSlider() {
  const activeBtn = document.querySelector('.seg-btn.active');
  const seg = document.getElementById('segControl');
  const slider = document.getElementById('segSlider');
  if (!activeBtn || !seg || !slider) return;
  const segRect = seg.getBoundingClientRect();
  const btnRect = activeBtn.getBoundingClientRect();
  slider.style.left = (btnRect.left - segRect.left) + 'px';
  slider.style.width = btnRect.width + 'px';
}

function quickAdd() {
  if (currentCat === 'album') openAlbumModal();
  else if (currentCat === 'memo') openMemoModal();
  else openRecipeModal();
}

// ============================================================
// 相册操作
// ============================================================
let albumCoverData = null;

function openAlbumModal(albumId) {
  const album = albumId ? data.albums.find(function(a) { return a.id === albumId; }) : null;
  albumCoverData = null;
  showModal(
    '<div class="modal-title">' + (album ? '编辑相册' : '新建相册') + '</div>' +
    '<div class="form-group"><label class="form-label">相册名称</label><input class="form-input" id="albumNameInput" value="' + (album ? escAttr(album.name) : '') + '" placeholder="输入相册名称"></div>' +
    '<div class="form-group"><label class="form-label">封面图</label><label class="form-file" id="albumCoverLabel">' + (album && album.cover ? '点击更换封面图' : '点击选择封面图') + '<input type="file" accept="image/*" id="albumCoverInput" onchange="previewAlbumCover(this)"></label><div id="albumCoverPreview" style="margin-top:8px">' + (album && album.cover ? '<img src="' + album.cover + '" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">' : '') + '</div></div>' +
    '<div class="modal-actions">' + (album ? '<button class="btn btn-danger" onclick="deleteAlbum(\'' + album.id + '\')">删除</button>' : '') + '<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAlbum(\'' + (album ? album.id : '') + '\')">保存</button></div>'
  );
}

function previewAlbumCover(input) {
  const file = input.files[0];
  if (!file) return;
  compressImage(file, 640, 0.72, function(src) {
    if (!src) return;
    albumCoverData = src;
    document.getElementById('albumCoverPreview').innerHTML = '<img src="' + src + '" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">';
    document.getElementById('albumCoverLabel').innerText = '点击更换封面图';
  });
}

function saveAlbum(id) {
  const name = document.getElementById('albumNameInput').value.trim();
  if (!name) { showToast('请输入相册名称'); return; }
  if (id) {
    const album = data.albums.find(function(a) { return a.id === id; });
    if (album) { album.name = name; if (albumCoverData) album.cover = albumCoverData; }
  } else {
    data.albums.push({ id: uid(), name: name, cover: albumCoverData || null, items: [] });
  }
  albumCoverData = null;
  saveData();
  closeModal();
  if (id && currentAlbumId === id) { const a = data.albums.find(function(x) { return x.id === id; }); if (a) document.getElementById('adTitle').textContent = a.name; }
  renderAlbums(); renderCounts(); renderOverview();
  showToast(id ? '相册已更新' : '相册已创建');
}

function deleteAlbum(id) {
  data.albums = data.albums.filter(function(a) { return a.id !== id; });
  saveData();
  closeModal();
  if (currentAlbumId === id) closeAlbum();
  renderAlbums(); renderCounts(); renderOverview();
  showToast('相册已删除');
}

function openAlbum(albumId) {
  const album = data.albums.find(function(a) { return a.id === albumId; });
  if (!album) return;
  currentAlbumId = albumId;
  if (!album.items) album.items = [];
  document.getElementById('adTitle').textContent = album.name;
  refreshAlbumGrid(album);
  document.getElementById('albumDetailOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  document.getElementById('albumDetail').scrollTop = 0;
}

function closeAlbum() {
  document.getElementById('albumDetailOverlay').style.display = 'none';
  document.body.style.overflow = '';
  currentAlbumId = null;
  renderAlbums(); renderCounts();
}

function refreshAlbumGrid(album) {
  const grid = document.getElementById('albumItemsGrid');
  if (grid) grid.innerHTML = renderAlbumItems(album.items);
}

function renderAlbumItems(items) {
  if (!items || items.length === 0) return '<div class="empty-state" style="padding:20px"><div class="empty-state-text">还没有内容，添加照片或视频吧</div></div>';
  return items.map(function(item, i) {
    return '<div class="card" style="position:relative" onclick="previewItem(' + i + ')">' +
      (item.type === 'video' ? (item.poster ? '<img class="card-thumb" src="' + item.poster + '" alt="" loading="lazy">' : '<div class="card-thumb vid-placeholder">🎬</div>') : '<img class="card-thumb" src="' + item.src + '" alt="" loading="lazy">') +
      '<div class="card-body"><div class="card-title" style="font-size:0.74rem">' + (item.type === 'video' ? '🎬 视频' : '📷 照片') + '</div></div>' +
      '<button class="icon-btn" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.42);color:#fff;width:28px;height:28px;font-size:0.8rem" onclick="event.stopPropagation();removeAlbumItem(' + i + ')">✕</button></div>';
  }).join('');
}

async function addAlbumItems(input) {
  const files = Array.from(input.files);
  if (files.length === 0) return;
  const album = data.albums.find(function(a) { return a.id === currentAlbumId; });
  if (!album) return;
  input.value = '';
  const prog = document.getElementById('adProgress');
  let done = 0;
  function updateProg() {
    if (prog) { prog.style.display = 'block'; prog.textContent = '正在处理 ' + done + ' / ' + files.length + ' …'; }
  }
  updateProg();
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    // 每个文件最多 5 秒，超时跳过，保证队列必前进
    await Promise.race([
      new Promise(function(resolve) {
        if (isVideoFile(file)) {
          const id = uid();
          idbPut(id, file).then(function() {
            extractVideoPoster(file, function(poster) {
              album.items.push({ id: id, type: 'video', src: 'idb:' + id, poster: poster || '', comment1: '', comment2: '' });
              done++; updateProg(); resolve();
            });
          }).catch(function() { done++; updateProg(); resolve(); });
        } else {
          compressImage(file, 1080, 0.78, function(src) {
            if (src) album.items.push({ id: uid(), type: 'image', src: src, comment1: '', comment2: '' });
            done++; updateProg(); resolve();
          });
        }
      }),
      new Promise(function(resolve) { setTimeout(function() { done++; updateProg(); resolve(); }, 5000); })
    ]);
  }
  saveData();
  refreshAlbumGrid(album);
  if (prog) prog.style.display = 'none';
  showToast('已添加 ' + files.length + ' 个文件 ✓');
}

function removeAlbumItem(index) {
  const album = data.albums.find(function(a) { return a.id === currentAlbumId; });
  if (!album) return;
  const item = album.items[index];
  if (item && item.type === 'video' && item.src && item.src.indexOf('idb:') === 0) {
    idbDelete(item.src.slice(4));
  }
  album.items.splice(index, 1);
  saveData();
  refreshAlbumGrid(album);
}

// 图片预览（备忘录/菜谱 → 右侧面板或全屏）
// ============================================================
function isDesktop() { return window.matchMedia('(min-width: 960px)').matches; }

function previewMemoRecipeItem(id, type) {
  let item;
  if (type === 'memo') item = data.memos.find(function(m) { return m.id === id; });
  else item = data.recipes.find(function(r) { return r.id === id; });
  if (!item || !item.image) return;
  if (!item.comment1) item.comment1 = '';
  if (!item.comment2) item.comment2 = '';
  currentPreviewItems = [item];
  currentPreviewIndex = 0;
  showPreview(0);
}

function previewItem(index) {
  const album = data.albums.find(function(a) { return a.id === currentAlbumId; });
  if (!album || !album.items) return;
  currentPreviewItems = album.items;
  currentPreviewIndex = index;
  showPreview(index);
}

function showPreview(index) {
  const item = currentPreviewItems[index];
  if (!item) return;
  if (isDesktop()) {
    renderDetailPreview(item, index);
  } else {
    renderOverlayPreview(item, index);
  }
}

function renderDetailPreview(item, index) {
  const overview = document.getElementById('detailOverview');
  const view = document.getElementById('detailView');
  if (!view) return;
  const src = item.src || item.image;
  const mediaHtml = item.type === 'video'
    ? '<video class="detail-media" poster="' + (item.poster || '') + '" controls playsinline></video>'
    : '<img class="detail-media" src="' + src + '" alt="">';
  view.innerHTML =
    '<div class="detail-head">' +
      '<button class="detail-back" onclick="closeDetailPreview()">‹ 返回</button>' +
      '<div class="detail-count">' + (index + 1) + ' / ' + currentPreviewItems.length + '</div>' +
    '</div>' +
    '<div class="detail-media-wrap">' + mediaHtml + '</div>' +
    '<div class="detail-comments">' +
      '<div class="pc-label">🐷 大胖小子的备注</div>' +
      '<textarea class="pc-input fat" id="previewComment1" placeholder="大胖小子在此备注…">' + escHtml(item.comment1 || '') + '</textarea>' +
      '<div class="pc-label">🐱 小瘦大子的备注</div>' +
      '<textarea class="pc-input thin" id="previewComment2" placeholder="小瘦大子在此备注…">' + escHtml(item.comment2 || '') + '</textarea>' +
    '</div>' +
    '<div class="detail-nav">' +
      (index > 0 ? '<button class="dnav-btn" onclick="navigatePreview(-1)">‹ 上一张</button>' : '<span style="flex:1"></span>') +
      (index < currentPreviewItems.length - 1 ? '<button class="dnav-btn" onclick="navigatePreview(1)">下一张 ›</button>' : '<span style="flex:1"></span>') +
    '</div>';
  overview.style.display = 'none';
  view.style.display = 'flex';
  view.scrollTop = 0;
  if (item.type === 'video') {
    resolveVideoSrc(item, function(url) {
      const v = view.querySelector('video.detail-media');
      if (v && url) { v.src = url; v.load(); }
    });
  }
}

function closeDetailPreview() {
  savePreviewComments();
  const overview = document.getElementById('detailOverview');
  const view = document.getElementById('detailView');
  if (view) view.style.display = 'none';
  if (overview) overview.style.display = 'block';
}

function renderOverlayPreview(item, index) {
  const src = item.src || item.image;
  const existing = document.querySelector('.preview-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'preview-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) { savePreviewComments(); overlay.remove(); } };

  const mediaHtml = item.type === 'video'
    ? '<video class="preview-media" poster="' + (item.poster || '') + '" controls playsinline></video>'
    : '<img class="preview-media" src="' + src + '" alt="">';

  overlay.innerHTML =
    '<button class="preview-close" onclick="savePreviewComments();this.closest(\'.preview-overlay\').remove()">✕</button>' +
    (index > 0 ? '<button class="preview-nav prev" onclick="event.stopPropagation();navigatePreview(-1)">‹</button>' : '') +
    (index < currentPreviewItems.length - 1 ? '<button class="preview-nav next" onclick="event.stopPropagation();navigatePreview(1)">›</button>' : '') +
    mediaHtml +
    '<div class="preview-comments">' +
      '<div><div class="preview-comment-label">大胖小子的备注</div><input class="preview-comment-input fat" id="previewComment1" value="' + escAttr(item.comment1 || '') + '" placeholder="大胖小子在此备注…"></div>' +
      '<div><div class="preview-comment-label">小瘦大子的备注</div><input class="preview-comment-input thin" id="previewComment2" value="' + escAttr(item.comment2 || '') + '" placeholder="小瘦大子在此备注…"></div>' +
    '</div>';

  document.body.appendChild(overlay);
  if (item.type === 'video') {
    resolveVideoSrc(item, function(url) {
      const v = overlay.querySelector('video.preview-media');
      if (v && url) { v.src = url; v.load(); }
    });
  }
}

function navigatePreview(delta) {
  savePreviewComments();
  currentPreviewIndex += delta;
  if (currentPreviewIndex < 0) currentPreviewIndex = 0;
  if (currentPreviewIndex >= currentPreviewItems.length) currentPreviewIndex = currentPreviewItems.length - 1;
  showPreview(currentPreviewIndex);
}

function savePreviewComments() {
  const c1 = document.getElementById('previewComment1');
  const c2 = document.getElementById('previewComment2');
  if (!c1 || !c2) return;
  const item = currentPreviewItems[currentPreviewIndex];
  if (!item) return;
  item.comment1 = c1.value;
  item.comment2 = c2.value;
  saveData();
}

// ============================================================
function toggleSelectMode() {
  isSelectMode = !isSelectMode;
  selectedIds.clear();
  setText('selectLabel', isSelectMode ? '取消多选' : '多选');
  document.body.classList.toggle('select-mode', isSelectMode);
  if (isSelectMode) showSelectBar(); else removeSelectBar();
  closeContextMenu();
  renderAll();
}

function exitSelectMode() {
  if (!isSelectMode) return;
  isSelectMode = false;
  selectedIds.clear();
  setText('selectLabel', '多选');
  document.body.classList.remove('select-mode');
  removeSelectBar();
}

function toggleSelect(id, el) {
  if (selectedIds.has(id)) { selectedIds.delete(id); el.classList.remove('selected'); }
  else { selectedIds.add(id); el.classList.add('selected'); }
  updateSelectCount();
}

function updateSelectCount() {
  const bar = document.querySelector('.select-bar');
  if (bar) bar.querySelector('.select-count').textContent = '已选 ' + selectedIds.size + ' 项';
}

function showSelectBar() {
  removeSelectBar();
  const bar = document.createElement('div');
  bar.className = 'select-bar';
  bar.innerHTML = '<span class="select-count">已选 0 项</span><button class="btn btn-danger" style="padding:8px 16px;font-size:0.82rem" onclick="batchDelete()">批量删除</button><button class="btn btn-secondary" style="padding:8px 16px;font-size:0.82rem" onclick="toggleSelectMode()">取消</button>';
  document.body.appendChild(bar);
}

function removeSelectBar() {
  const bar = document.querySelector('.select-bar');
  if (bar) bar.remove();
}

function batchDelete() {
  if (selectedIds.size === 0) return;
  if (!confirm('确定删除选中的 ' + selectedIds.size + ' 项吗？此操作不可撤销。')) return;
  if (currentCat === 'album') data.albums = data.albums.filter(function(a) { return !selectedIds.has(a.id); });
  else if (currentCat === 'memo') data.memos = data.memos.filter(function(m) { return !selectedIds.has(m.id); });
  else if (currentCat === 'recipe') data.recipes = data.recipes.filter(function(r) { return !selectedIds.has(r.id); });
  saveData();
  toggleSelectMode();
  renderAll();
  showToast('已删除');
}

function backupData() {
  closeContextMenu();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lifeboard-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份文件已下载');
}

function triggerImport() {
  closeContextMenu();
  document.getElementById('importFileInput').click();
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const imported = JSON.parse(reader.result);
      data = {
        albums: mergeImport(data.albums, imported.albums || []),
        memos: mergeImport(data.memos, imported.memos || []),
        recipes: mergeImport(data.recipes, imported.recipes || []),
        guestbook: mergeImport(data.guestbook, imported.guestbook || [])
      };
      saveData();
      renderAll();
      showToast('备份导入成功！');
    } catch(e) { showToast('备份文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function mergeImport(localArr, importArr) {
  const existingIds = new Set(localArr.map(function(i) { return i.id; }));
  const newItems = importArr.filter(function(i) { return !existingIds.has(i.id); });
  return localArr.concat(newItems);
}

function showModal(html) {

function closeModal() {

// ---------- IndexedDB 视频存储（视频文件大，不进 localStorage） ----------
function idbOpen() {
  return new Promise(function(resolve, reject) {
    const req = indexedDB.open('lifeboard-media', 1);
    req.onupgradeneeded = function() {
      if (!req.result.objectStoreNames.contains('videos')) {
        req.result.createObjectStore('videos');
      }
    };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
  });
}
function idbPut(key, blob) {
  return idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put(blob, key);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}
function idbGet(key) {
  return idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction('videos', 'readonly');
      const req = tx.objectStore('videos').get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  });
}
function idbDelete(key) {
  return idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').delete(key);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}
function isVideoFile(file) {
  if (file && file.type && file.type.indexOf('video/') === 0) return true;
  return /\.(mp4|webm|mov|m4v|avi|mkv|3gp|mts|m2ts)$/i.test(file.name || '');
}
function extractVideoPoster(file, callback) {
  let url = null;
  try { url = URL.createObjectURL(file); } catch(e) {}
  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.preload = 'metadata';
  let done = false;
  function finish(poster) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { if (url) URL.revokeObjectURL(url); } catch(e) {}
    callback(poster);
  }
  function trySeek() {
    try {
      if (typeof video.duration === 'number' && video.duration > 0) {
        video.currentTime = Math.min(0.3, video.duration / 4);
      }
    } catch(e) { finish(''); }
  }
  // 超时保护：1.5 秒拿不到封面就用空封面，绝不卡死
  const timer = setTimeout(function() { finish(''); }, 1500);
  video.onloadedmetadata = function() { trySeek(); };
  video.onloadeddata = function() { trySeek(); };
  video.onseeked = function() {
    try {
      const w0 = video.videoWidth || 0, h0 = video.videoHeight || 0;
      if (!w0 || !h0) { finish(''); return; }
      const scale = Math.min(1, 640 / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale));
      const h = Math.max(1, Math.round(h0 * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      finish(canvas.toDataURL('image/jpeg', 0.6));
    } catch(e) { finish(''); }
  };
  video.onerror = function() { finish(''); };
  if (url) video.src = url;
}
function resolveVideoSrc(item, callback) {
  if (!item) { callback(''); return; }
  if (item.type !== 'video') { callback(item.src || ''); return; }
  const s = item.src || '';
  if (s.indexOf('idb:') === 0) {
    idbGet(s.slice(4)).then(function(blob) {
      if (blob) callback(URL.createObjectURL(blob));
      else callback('');
    }).catch(function() { callback(''); });
  } else {
    callback(s);
  }
}
function compressImage(file, maxDim, quality, callback) {
  // 用 Image 轻量读取原始尺寸（不完整解码位图），再 createImageBitmap 一次性降采样
  const url = URL.createObjectURL(file);
  const img = new Image();
  let settled = false;
  function fail() { try { URL.revokeObjectURL(url); } catch(e) {} if (!settled) { settled = true; compressImageFallback(file, maxDim, quality, callback); } }
  img.onload = function() {
    try {
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      try { URL.revokeObjectURL(url); } catch(e) {}
      if (window.createImageBitmap) {
        createImageBitmap(file, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' }).then(function(bmp) {
          const canvas = document.createElement('canvas');
          canvas.width = bmp.width; canvas.height = bmp.height;
          canvas.getContext('2d').drawImage(bmp, 0, 0);
          bmp.close();
          if (!settled) { settled = true; callback(canvas.toDataURL('image/jpeg', quality)); }
        }).catch(function() { fail(); });
      } else {
        // 老浏览器：Image 已拿到尺寸，直接画小 canvas
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        if (!settled) { settled = true; callback(canvas.toDataURL('image/jpeg', quality)); }
      }
    } catch(e) { fail(); }
  };
  img.onerror = function() { fail(); };
  img.src = url;
}function compressImageFallback(file, maxDim, quality, callback) {
  const reader = new FileReader();
  reader.onload = function() {
    const img = new Image();
    img.onload = function() {
      try {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', quality));
      } catch(e) { callback(reader.result); }
    };
    img.onerror = function() { callback(reader.result); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

// Token management (runtime, stored in localStorage)
// ============================================================
function openTokenModal() {
  var input = document.getElementById('tokenInput');
  if (input) input.value = localStorage.getItem('lifeboard_github_token') || '';
  var modal = document.getElementById('tokenModal');
  if (modal) { modal.style.display = 'flex'; }
}

function closeTokenModal() {
  var modal = document.getElementById('tokenModal');
  if (modal) { modal.style.display = 'none'; }
}

async function saveToken() {
  var input = document.getElementById('tokenInput');
  var raw = input ? input.value.trim() : '';
  if (!raw) { showToast('请输入有效的 Token'); return; }
  GITHUB_TOKEN = raw;
  localStorage.setItem('lifeboard_github_token', raw);
  closeTokenModal();
  showToast('Token 已保存，正在验证…');
  var ok = await testToken();
  if (ok) {
    showToast('Token 有效 ✓ 云端同步已就绪');
    syncToCloud().then(function() { loadFromCloud().then(function() { renderAll(); }); });
  } else {
    showToast('Token 验证失败，请检查权限设置');
    updateSyncDot('error');
  }
}

async function testToken() {
  try {
    var resp = await fetch('https://api.github.com/user', { headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github+json' } });
    return resp.ok;
  } catch(e) { return false; }
}
